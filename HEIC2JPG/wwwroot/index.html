<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NoTransfer Media Converter</title>
    <base href="/" />
    <!-- Bootstrap CSS (Toast機能に必要) -->
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/converter.css" />
    <!-- テーママネージャー（Blazor初期化前に実行） -->
    <script src="js/themeManager.js"></script>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NoTransfer" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link href="HEIC2JPG.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <!-- Bootstrap JavaScript (Toast機能に必要) -->
    <script src="lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/jszip/jszip.min.js"></script>
    <script src="lib/libheif/libheif.js"></script>
    <script src="lib/ffmpeg/ffmpeg.min.js"></script>
    <!-- ローカライゼーションを最初に読み込み -->
    <script src="js/localization.js"></script>
    <!-- 共通ユーティリティ -->
    <script src="js/commonUtils.js"></script>
    <!-- ネットワーク監視 -->
    <script src="js/networkMonitor.js"></script>
    <!-- 変換機能 -->
    <script src="js/heicConverter.js"></script>
    <script src="js/ffmpegConverter.js"></script>
    
    <!-- PWA Service Worker -->
    <script src="js/pwa.js"></script>
</body>

</html>
